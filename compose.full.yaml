services:
  aliashub:
    environment:
      REGISTRATION_SERVICE_URL: http://registration-worker:8000
      REGISTRATION_SERVICE_TOKEN: "${REGISTRATION_SERVICE_TOKEN:?run ./scripts/setup-local.sh --full first}"
      REGISTRATION_MAILBOX_URL: http://aliashub:4180
      REGISTRATION_BROWSER_URL: "${REGISTRATION_BROWSER_URL:-http://127.0.0.1:${REGISTRATION_BROWSER_PORT:-6080}/vnc.html?autoconnect=true&resize=scale&path=websockify}"
      PICKUP_SERVICE_URL: http://mail-pickup:4190
      PICKUP_PUBLIC_URL: "${PICKUP_PUBLIC_BASE_URL:-http://127.0.0.1:4190}"
      PICKUP_ADMIN_USERNAME: "${PICKUP_ADMIN_USERNAME:-admin}"
      PICKUP_ADMIN_PASSWORD: "${PICKUP_ADMIN_PASSWORD:-}"
      PAYMENT_LINK_SERVICE_URL: http://payment-link-extractor:18794
      PAYMENT_LINK_SERVICE_PASSWORD: "${PAYMENT_LINK_SERVICE_PASSWORD:?run ./scripts/setup-local.sh --full first}"
    depends_on:
      registration-worker:
        condition: service_healthy
      mail-pickup:
        condition: service_healthy
      payment-link-extractor:
        condition: service_healthy

  registration-worker:
    build:
      context: ./registration-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: "1gb"
    env_file:
      - path: ./registration-worker/.env
        required: false
    environment:
      DISPLAY: ":99"
      ACCOUNT_MANAGER_DATABASE_URL: sqlite:////app/data/account_manager.db
      APP_PASSWORD: "${REGISTRATION_SERVICE_TOKEN:?run ./scripts/setup-local.sh --full first}"
      VNC_PASSWORD: "${REGISTRATION_VNC_PASSWORD:?run ./scripts/setup-local.sh --full first}"
    ports:
      - "127.0.0.1:${REGISTRATION_WORKER_PORT:-8000}:8000"
      - "127.0.0.1:${REGISTRATION_BROWSER_PORT:-6080}:6080"
    volumes:
      - ./data/registration-worker:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 10

  mail-pickup:
    build:
      context: ./mail-pickup
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PICKUP_HOST: 0.0.0.0
      PICKUP_PORT: 4190
      PICKUP_DATABASE_PATH: /app/data/mail-pickup.db
      PICKUP_EMAIL_DOMAIN: "${PICKUP_EMAIL_DOMAIN:-example.com}"
      PICKUP_PUBLIC_BASE_URL: "${PICKUP_PUBLIC_BASE_URL:-http://127.0.0.1:4190}"
      PICKUP_INBOUND_TOKEN: "${PICKUP_INBOUND_TOKEN:-}"
      PICKUP_TOKEN_SECRET: "${PICKUP_TOKEN_SECRET:-}"
      PICKUP_ADMIN_USERNAME: "${PICKUP_ADMIN_USERNAME:-admin}"
      PICKUP_ADMIN_PASSWORD: "${PICKUP_ADMIN_PASSWORD:-}"
      PICKUP_ALIAS_HUB_DATABASE_PATH: /alias-data/outlook-alias-hub.db
      PICKUP_ALIAS_HUB_URL: http://aliashub:4180
      PICKUP_ALIAS_HUB_SCAN_SECONDS: "${PICKUP_ALIAS_HUB_SCAN_SECONDS:-15}"
      PICKUP_RETENTION_DAYS: "${PICKUP_RETENTION_DAYS:-30}"
      PICKUP_MAX_MESSAGES: "${PICKUP_MAX_MESSAGES:-200}"
      PICKUP_LDXP_GOODS_ID: "${PICKUP_LDXP_GOODS_ID:-0}"
      PICKUP_LDXP_IMAGE_URL: "${PICKUP_LDXP_IMAGE_URL:-}"
      LDXP_PROXY_POOL: "${LDXP_PROXY_POOL:-}"
      LDXP_CDP_URL: "${LDXP_CDP_URL:-}"
      LDXP_PLAYWRIGHT_HEADLESS: "${LDXP_PLAYWRIGHT_HEADLESS:-1}"
    ports:
      - "127.0.0.1:${PICKUP_PORT:-4190}:4190"
    volumes:
      - ./data/mail-pickup:/app/data
      - ./data:/alias-data:ro

  payment-link-extractor:
    build:
      context: ./payment-link-extractor
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      OPLL_WEB_HOST: 0.0.0.0
      OPLL_WEB_PORT: 18794
      OPLL_WEB_PASSWORD: "${PAYMENT_LINK_SERVICE_PASSWORD:?run ./scripts/setup-local.sh --full first}"
      OPLL_COUNTRY: DE
      OPLL_FORCE_COUNTRY: ""
      OPLL_PAYMENT_METHOD: paypal
      OPLL_UPDATE_CHECKOUT: "true"
      OPLL_TASK_WORKERS: "${PAYMENT_LINK_TASK_WORKERS:-4}"
      OPLL_TASK_TTL_SECONDS: "${PAYMENT_LINK_TASK_TTL_SECONDS:-3600}"
      OPLL_TASK_EVENT_HISTORY_SIZE: "${PAYMENT_LINK_TASK_EVENT_HISTORY_SIZE:-500}"
      OPLL_LOG_LEVEL: "${PAYMENT_LINK_LOG_LEVEL:-INFO}"
      OPLL_LOG_FILE: /app/data/payment-link.log
      OPLL_LOG_JSON: "${PAYMENT_LINK_LOG_JSON:-false}"
      IPROCKET_CHAIN_PROXY: http://127.0.0.1:18796
      IPROCKET_BRIDGE_PORT: 18796
      IPROCKET_PRE_PROXY_HOST: "${PAYMENT_LINK_IPROCKET_PRE_PROXY_HOST:-}"
      IPROCKET_PRE_PROXY_PORT: "${PAYMENT_LINK_IPROCKET_PRE_PROXY_PORT:-3251}"
    ports:
      - "127.0.0.1:${PAYMENT_LINK_SERVICE_PORT:-18794}:18794"
    volumes:
      - ./data/payment-link-extractor:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket,urllib.request; r=urllib.request.Request('http://127.0.0.1:18794/api/health', headers={'X-Workbench-Password': os.environ.get('OPLL_WEB_PASSWORD', '')}); urllib.request.urlopen(r, timeout=3).read(); socket.create_connection(('127.0.0.1', 18796), 3).close()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 4
